<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16202E" />
    <title>click.ai Console</title>
    <script>
      // Apply persisted theme + language before paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('cb.theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var el = document.documentElement;
          if (t === 'dark') el.classList.add('dark');
          el.style.colorScheme = t;
          var l = localStorage.getItem('cb.lang');
          if (l !== 'en' && l !== 'ar') l = (navigator.language || '').indexOf('ar') === 0 ? 'ar' : 'en';
          el.lang = l;
          el.dir = l === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
