server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. nginx resolves `upstream` names once at parse
    # time, so after a rolling replacement of the API containers this proxy
    # would hold dead IPs and 502 until restarted. A variable in proxy_pass
    # forces re-resolution on the interval below instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Must be >= MAX_UPLOAD_SIZE_MB (20 MB) plus overhead. nginx defaults to
    # 1 MB, which would 413 every document upload at the proxy before Django
    # ever saw the request. Carried over from the API's old nginx config.
    client_max_body_size 25M;

    # Same-origin API access, reproducing the rewrites vercel.json performs
    # today. This is what keeps VITE_API_BASE_URL empty and CORS off the
    # dashboard's critical path.
    location /api/ {
        set $api_upstream http://web:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Traefik terminates TLS and speaks plain HTTP to this container, so
        # $scheme here is always "http". Django's SECURE_PROXY_SSL_HEADER reads
        # this header to decide request.is_secure(), which drives every absolute
        # URL it builds (DRF pagination links, media URLs). Sending $scheme makes
        # those http:// and they are then blocked as mixed content. This nginx
        # only ever runs behind Traefik TLS, so the literal is correct.
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        # Chat answers wait on an LLM round trip; the default 60s is too tight.
        proxy_read_timeout 120s;
    }

    location /media/ {
        set $media_upstream http://media:80;
        proxy_pass $media_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        access_log off;
    }

    # Vite emits content-hashed filenames under /assets/, so they are safe to
    # cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it carries the hashed asset references,
    # so a cached copy points at assets a deploy has already replaced.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: any unknown path renders the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
